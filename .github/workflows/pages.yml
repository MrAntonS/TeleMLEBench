name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate static contract
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser contract tests
        run: npm run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Temporary local-companion mode: a visitor's browser talks to the API
      # running on that same visitor's machine. Set TMLB_API_BASE to an HTTPS
      # production API later without changing the application.
      API_BASE: ${{ vars.TMLB_API_BASE || 'http://127.0.0.1:8080/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production API origin
        shell: bash
        run: |
          case "$API_BASE" in
            https://*/api/v1) ;;
            http://127.0.0.1:8080/api/v1) echo "::warning::Using temporary loopback API companion mode." ;;
            *) echo "TMLB_API_BASE must be HTTPS ending in /api/v1, or the exact temporary loopback URL."; exit 1 ;;
          esac
      - name: Stage site
        shell: bash
        run: |
          mkdir -p dist
          cp index.html app.js dist/
          printf 'window.TMLB_API_BASE = "%s";\n' "$API_BASE" > dist/config.js
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
