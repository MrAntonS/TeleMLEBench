<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071526">
  <meta name="description" content="TeleMLEBench is a source-first catalog of telecom ML datasets, paper evidence, and controlled reproduction results.">
  <title>TeleMLEBench — telecom ML evidence hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --navy-950:#071526;
      --navy-900:#0a1c32;
      --navy-800:#102c49;
      --ink:#10233d;
      --muted:#59708a;
      --subtle:#7f91a5;
      --line:#d8e2ed;
      --line-strong:#b9c9da;
      --paper:#f4f8fc;
      --white:#fff;
      --blue:#3d77ff;
      --blue-dark:#2458c8;
      --cyan:#24d1d8;
      --cyan-soft:#dffafb;
      --amber:#f2b84b;
      --amber-soft:#fff3d7;
      --red:#cb4f5c;
      --green:#168b72;
      --radius:14px;
      --shadow:0 16px 38px rgba(7,21,38,.08);
      --max:1240px;
      --display:"Oxanium",system-ui,sans-serif;
      --body:"IBM Plex Sans",system-ui,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    img,svg{display:block}
    :focus-visible{outline:3px solid rgba(61,119,255,.42);outline-offset:3px}
    .skip{position:fixed;left:16px;top:-80px;z-index:100;background:var(--white);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow)}
    .skip:focus{top:16px}
    .shell{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(7,21,38,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1)}
    .nav{max-width:var(--max);height:68px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:24px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;flex:none}
    .brand-mark{width:33px;height:33px;border:1px solid rgba(36,209,216,.55);border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(61,119,255,.25),rgba(36,209,216,.08))}
    .brand-mark svg{width:23px;height:23px}
    .brand-name{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.02em}
    .navlinks{display:flex;align-items:center;gap:3px;margin-left:auto}
    .navlink{border:0;background:transparent;color:#afc1d3;padding:9px 11px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:500}
    .navlink:hover,.navlink[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
    .nav-cta{margin-left:8px;border:1px solid rgba(36,209,216,.45);background:rgba(36,209,216,.1);color:#cbfbfd;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
    .nav-toggle{display:none;margin-left:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px}
    main{min-height:calc(100vh - 137px)}
    .container{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
    .page{padding:52px 0 80px}
    .eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-dark)}
    .eyebrow:before{content:"";width:25px;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
    h1,h2,h3,p{margin-top:0}
    h1,h2,h3{font-family:var(--display)}
    h1{font-size:clamp(38px,6vw,72px);line-height:.98;letter-spacing:-.045em}
    h2{font-size:clamp(27px,3.3vw,43px);line-height:1.06;letter-spacing:-.035em}
    h3{font-size:18px;line-height:1.25}
    .muted{color:var(--muted)}
    .mono{font-family:var(--mono)}
    .hero{position:relative;overflow:hidden;background:var(--navy-950);color:#fff;padding:74px 0 44px}
    .hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(36,209,216,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(36,209,216,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,#000,transparent 84%)}
    .hero:after{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-260px;background:radial-gradient(circle,rgba(61,119,255,.3),transparent 64%);pointer-events:none}
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:64px;align-items:end}
    .hero .eyebrow{color:#70e4e9}
    .hero h1{max-width:780px;margin:18px 0 22px}
    .hero h1 span{color:var(--cyan)}
    .hero-copy{max-width:700px;color:#bac9d8;font-size:18px;line-height:1.62}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:11px 15px;text-decoration:none;font-size:14px;font-weight:600;transition:transform .15s,background .15s,border-color .15s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--blue);color:#fff}
    .btn-primary:hover{background:#5085ff}
    .btn-ghost{border-color:rgba(255,255,255,.22);color:#e2edf8;background:rgba(255,255,255,.04)}
    .btn-light{background:#fff;border-color:var(--line);color:var(--ink)}
    .btn-link{color:var(--blue-dark);padding:0}
    .signal-panel{border:1px solid rgba(36,209,216,.22);background:rgba(9,31,52,.82);padding:20px;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .signal-label{font-family:var(--mono);color:#6f899f;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .signal-path{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}
    .signal-node{position:relative;text-align:center;min-width:0}
    .signal-node:not(:last-child):after{content:"";position:absolute;height:2px;background:linear-gradient(90deg,var(--cyan),var(--blue));left:calc(50% + 13px);right:calc(-50% + 13px);top:10px;opacity:.65}
    .signal-dot{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;margin:0 auto 10px;border:5px solid var(--navy-900);box-shadow:0 0 0 2px var(--cyan);background:var(--cyan)}
    .signal-node.pending .signal-dot{background:var(--amber);box-shadow:0 0 0 2px var(--amber)}
    .signal-node.off .signal-dot{background:#50657a;box-shadow:0 0 0 2px #50657a}
    .signal-node span{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#a9bdcf}
    .signal-readout{margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:17px;display:grid;grid-template-columns:1fr auto;gap:7px;color:#a9bdcf;font-size:12px}
    .signal-readout strong{color:#fff;font-family:var(--mono);font-weight:500}
    .stat-band{background:#fff;border-bottom:1px solid var(--line)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr)}
    .stat{padding:22px 24px;border-left:1px solid var(--line)}
    .stat:last-child{border-right:1px solid var(--line)}
    .stat-value{font-family:var(--display);font-weight:700;font-size:28px;color:var(--navy-900)}
    .stat-label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--subtle);margin-top:4px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:26px}
    .section-head h2{margin:10px 0 0}
    .section-copy{max-width:560px;color:var(--muted);line-height:1.6}
    .grid{display:grid;gap:16px}
    .card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(7,21,38,.02)}
    .dataset-card{position:relative;padding:22px;display:flex;flex-direction:column;min-height:290px;text-decoration:none;overflow:hidden;transition:transform .16s,border-color .16s,box-shadow .16s}
    .dataset-card:before{content:"";height:3px;position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,var(--blue),var(--cyan))}
    .dataset-card:hover{transform:translateY(-3px);border-color:#a9c5e4;box-shadow:var(--shadow)}
    .card-kicker{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .id{font-family:var(--mono);color:var(--subtle);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 8px;font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:#edf4ff;color:#285cba;white-space:nowrap}
    .status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .status.open,.status.published,.status.verified{background:#e7f7f2;color:var(--green)}
    .status.gated,.status.pending,.status.unknown{background:var(--amber-soft);color:#91630a}
    .status.failed,.status.restricted,.status.rejected{background:#fdecef;color:var(--red)}
    .dataset-card h3{font-size:21px;margin:24px 0 10px;overflow-wrap:anywhere}
    .dataset-card p{color:var(--muted);line-height:1.55;font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
    .tag-row{display:flex;gap:7px;flex-wrap:wrap;margin:auto 0 18px}
    .tag{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#f9fbfd;color:#536d87;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em}
    .card-footer{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .mini-value{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)}
    .mini-label{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);margin-top:3px}
    .filters{display:grid;grid-template-columns:minmax(240px,2fr) repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:16px}
    .field{position:relative}
    .field label{position:absolute;left:12px;top:8px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);z-index:1}
    input,select{width:100%;height:58px;padding:22px 12px 7px;border:1px solid var(--line-strong);background:#fff;border-radius:9px;color:var(--ink);outline:0}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,119,255,.11)}
    .result-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0 20px;font-family:var(--mono);font-size:11px;color:var(--subtle)}
    .empty,.error,.loading{padding:48px 24px;text-align:center;background:#fff;border:1px dashed var(--line-strong);border-radius:var(--radius)}
    .error{border-color:#efb7bd;background:#fff9fa}
    .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .detail-hero{background:var(--navy-950);color:#fff;padding:48px 0 36px}
    .breadcrumbs{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10px;color:#8099af;margin-bottom:28px}
    .breadcrumbs a{color:#bcd0e0;text-decoration:none}
    .detail-title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:end}
    .detail-title h1{font-size:clamp(34px,5vw,57px);margin:12px 0 16px;overflow-wrap:anywhere}
    .detail-title p{color:#b6c6d5;max-width:780px;line-height:1.6;margin-bottom:0}
    .detail-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .detail-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.55fr);gap:22px;align-items:start}
    .panel{padding:24px}
    .panel + .panel{margin-top:18px}
    .panel-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:20px}
    .panel-head h2,.panel-head h3{margin:0}
    .panel h2{font-size:24px}
    .definition{font-size:16px;line-height:1.7;color:#3f5871}
    .kv{display:grid;grid-template-columns:140px 1fr;gap:0}
    .kv dt,.kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
    .kv dt{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle)}
    .kv dd{font-size:13px;overflow-wrap:anywhere}
    .source-list,.file-list,.paper-list,.repro-list{display:grid;gap:9px}
    .source-row,.file-row,.paper-row,.repro-row{border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:#fbfdff}
    .source-row,.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
    .row-title{font-weight:600;font-size:13px;overflow-wrap:anywhere}
    .row-meta{margin-top:4px;font-family:var(--mono);font-size:9px;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em}
    .rail-wrap{padding:28px;background:linear-gradient(145deg,#08192c,#0a223b);color:#fff;border-radius:var(--radius);overflow:hidden}
    .rail-wrap .signal-path{max-width:680px;margin:8px auto 0}
    .rail-copy{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:17px}
    .rail-copy div{text-align:center;min-width:0}
    .rail-copy strong{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rail-copy span{display:block;color:#8199ae;font-family:var(--mono);font-size:8px;text-transform:uppercase;margin-top:4px}
    .prose{max-width:820px}
    .prose h2{margin-top:42px}
    .prose h3{margin-top:28px}
    .prose p,.prose li{line-height:1.72;color:#405b75}
    .prose li+li{margin-top:8px}
    .steps{counter-reset:step;display:grid;gap:12px;margin-top:22px}
    .step{counter-increment:step;display:grid;grid-template-columns:46px 1fr;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
    .step:before{content:counter(step,decimal-leading-zero);font-family:var(--display);font-size:19px;color:var(--blue)}
    .step h3{margin:0 0 6px}
    .step p{margin:0}
    .coverage-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .coverage-card{padding:20px}
    .coverage-card strong{font-family:var(--display);font-size:27px}
    .coverage-card h3{margin:10px 0 6px}
    .coverage-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .evidence{border-left:3px solid var(--amber);padding:13px 15px;background:#fffaf0;color:#5f5134;font-size:13px;line-height:1.6}
    .repro-table{width:100%;border-collapse:collapse;font-size:12px}
    .repro-table th,.repro-table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
    .repro-table th{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}
    footer{background:var(--navy-950);color:#8ea6bb;border-top:1px solid rgba(255,255,255,.08)}
    .footer-inner{min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:24px;font-family:var(--mono);font-size:10px}
    .footer-links{display:flex;gap:18px}
    .footer-links a{text-decoration:none;color:#b7cada}
    .toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:380px;padding:13px 16px;background:var(--navy-900);color:#fff;border:1px solid rgba(36,209,216,.35);border-radius:10px;box-shadow:var(--shadow);font-size:13px}
    @media(max-width:980px){
      .navlinks{display:none;position:absolute;left:12px;right:12px;top:62px;background:var(--navy-900);border:1px solid rgba(255,255,255,.12);padding:10px;border-radius:10px;box-shadow:var(--shadow)}
      .navlinks.open{display:grid}
      .nav-toggle{display:block}
      .nav-cta{display:none}
      .hero-grid,.detail-body{grid-template-columns:1fr}
      .hero-grid{gap:36px}
      .hero .signal-panel{max-width:620px}
      .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
      .filters .field:first-child{grid-column:1/-1}
      .detail-title{grid-template-columns:1fr}
      .detail-actions{justify-content:flex-start}
      .coverage-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:620px){
      .container{width:min(100% - 30px,var(--max))}
      .page{padding:36px 0 58px}
      .hero{padding:52px 0 36px}
      .hero-copy{font-size:16px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .stat:nth-child(2){border-right:1px solid var(--line)}
      .stat:nth-child(n+3){border-top:1px solid var(--line)}
      .card-grid,.coverage-grid,.filters{grid-template-columns:1fr}
      .filters .field:first-child{grid-column:auto}
      .section-head{align-items:start;flex-direction:column}
      .card-footer{grid-template-columns:1fr 1fr}
      .detail-title h1{font-size:34px}
      .detail-actions .btn{width:100%}
      .kv{grid-template-columns:1fr}
      .kv dt{padding-bottom:3px;border:0}
      .kv dd{padding-top:0}
      .rail-wrap{padding:22px 12px}
      .rail-copy{gap:7px}
      .rail-copy strong{font-size:9px}
      .source-row,.file-row{grid-template-columns:1fr}
      .footer-inner{padding:26px 0;align-items:flex-start;flex-direction:column}
      .repro-table{display:block;overflow-x:auto}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
