<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWirelessML — wireless ML dataset hub</title>
<meta name="description" content="An open catalog of wireless ML datasets, prepared releases, paper-use evidence, and controlled research studies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#14161a;
    --muted:#5b616e;
    --subtle:#858b97;
    --line:#e9eaee;
    --line-strong:#d9dce2;
    --paper:#ffffff;
    --white:#ffffff;
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --cyan:#2563eb;
    --amber:#d97706;
    --amber-soft:#fff7ed;
    --red:#dc2626;
    --green:#16845b;
    --radius:14px;
    --shadow:0 6px 22px rgba(20,22,26,.07);
    --max:1064px;
    --display:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#14161a;background:#ffffff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  a{color:inherit;}
  button{font-family:inherit;}
  input::placeholder,textarea::placeholder{color:#9aa0ab;}
  ::selection{background:#dbe6ff;}
  :focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:3px;}

  @keyframes tmlFade{from{opacity:0}to{opacity:1}}
  @keyframes tmlSlide{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes tmlPop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

  /* utilities */
  .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  .tml-skip{position:fixed;left:16px;top:-80px;z-index:100;background:#fff;color:#14161a;padding:10px 14px;border:1px solid #e3e5e9;border-radius:8px;box-shadow:0 6px 22px rgba(20,22,26,.1);text-decoration:none;}
  .tml-skip:focus{top:16px;}
  .tml-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tml-cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;}
  .tml-splitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .tml-grid1{display:grid;gap:1px;background:#ececef;border:1px solid #ececef;border-radius:13px;overflow:hidden;}
  .tml-metastrip{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .tml-featstrip{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

  /* benchmark / dataset cards */
  .tml-card{cursor:pointer;border:1px solid #e9eaee;border-radius:14px;padding:22px 22px 20px;background:#fff;transition:border-color .15s,box-shadow .15s,transform .15s;}
  .tml-card:hover{border-color:#c9d6f5;box-shadow:0 6px 22px rgba(20,22,26,0.07);transform:translateY(-2px);}

  /* leaderboard rows */
  .tml-row-ai{transition:background .12s;}
  .tml-row-ai:hover{background:#f7faff !important;}

  /* download buttons in split cards */
  .tml-dl{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid #e3e5e9;border-radius:9px;padding:10px;font-size:13.5px;font-weight:600;color:#14161a;transition:border-color .15s,background .15s,color .15s;}
  .tml-dl:hover{border-color:#c9d6f5;background:#f7faff;color:#2563eb;}

  /* small icon links inside the table */
  .tml-iconlink{color:#6b7280;display:inline-flex;transition:color .12s;}
  .tml-iconlink:hover{color:#2563eb;}

  /* link rows in the reproduction panel */
  .tml-linkrow{display:flex;align-items:center;justify-content:space-between;text-decoration:none;border:1px solid #e3e5e9;border-radius:10px;padding:13px 15px;font-size:14px;font-weight:500;color:#14161a;transition:border-color .15s,background .15s;}
  .tml-linkrow:hover{border-color:#c9d6f5;background:#f7faff;}

  /* primary / dark buttons — subtle press + hover feedback */
  .tml-primary{transition:filter .12s;}
  .tml-primary:hover{filter:brightness(1.08);}
  .tml-primary:active{filter:brightness(0.94);}
  .tml-dark{transition:filter .15s;}
  .tml-dark:hover{filter:brightness(1.7);}

  /* Original application shell */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .tml-header{position:sticky;top:0;z-index:30;border-bottom:1px solid #ececef;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);}
  .tml-header-inner{position:relative;width:min(var(--max),calc(100% - 48px));height:62px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .tml-brand{display:flex;align-items:center;gap:11px;color:#14161a;text-decoration:none;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
  .tml-logo{width:28px;height:28px;padding:7px 6px;border-radius:7px;background:#2563eb;display:flex;align-items:flex-end;justify-content:center;gap:2.5px;}
  .tml-logo span{display:block;width:3px;background:#fff;border-radius:1px;}
  .tml-nav{display:flex;align-items:center;gap:4px;}
  .tml-navlink{padding:7px 13px;border-radius:7px;color:#5b616e;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background .12s,color .12s;}
  .tml-navlink:hover{color:#14161a;background:#f6f7f8;}
  .tml-navlink.active,.tml-navlink[aria-current="page"]{color:#14161a;background:#f1f2f4;}
  .tml-nav-toggle{display:none;margin-left:auto;padding:7px 11px;border:1px solid #e3e5e9;border-radius:7px;background:#fff;color:#14161a;font-size:13px;font-weight:600;cursor:pointer;}

  .tml-herosec{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:96px 0 64px;}
  .tml-hero{max-width:880px;margin:0;font-size:54px;line-height:1.04;letter-spacing:-.033em;font-weight:600;}
  .tml-hero-copy{max-width:660px;margin:24px 0 0;color:#5b616e;font-size:19px;line-height:1.55;}
  .tml-searchbox{max-width:600px;margin-top:36px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;border:1.5px solid #e3e5e9;border-radius:13px;background:#fff;box-shadow:0 1px 2px rgba(20,22,26,.04);}
  .tml-searchbox input,.tml-filter-search input{flex:1;width:auto;height:auto;padding:8px 0;border:0;border-radius:0;background:transparent;color:#14161a;font-size:15.5px;box-shadow:none;outline:none;}
  .tml-searchbox input:focus,.tml-filter-search input:focus{border:0;box-shadow:none;}
  .tml-button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 15px;border:1px solid #e3e5e9;border-radius:9px;background:#fff;color:#14161a;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s,color .12s,filter .12s;}
  .tml-button:hover{border-color:#c9d6f5;background:#f7faff;color:#2563eb;}
  .tml-button.primary{border-color:#2563eb;background:#2563eb;color:#fff;}
  .tml-button.primary:hover{filter:brightness(1.08);}
  .tml-stats{margin-top:56px;padding-top:34px;border-top:1px solid #ececef;display:flex;flex-wrap:wrap;gap:48px;}
  .tml-stat-value{font-size:34px;font-weight:600;letter-spacing:-.02em;}
  .tml-stats>div:last-child .tml-stat-value{color:#2563eb;}
  .tml-stat-label{margin-top:4px;color:#8a8f9a;font-size:13.5px;}

  .tml-section{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:8px 0 110px;}
  .tml-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:22px;}
  .tml-section-heading h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em;}
  .tml-section-heading a{color:#2563eb;text-decoration:none;font-size:14px;font-weight:600;}
  .tml-dataset-card{display:flex;min-height:258px;flex-direction:column;color:#14161a;text-decoration:none;}
  .tml-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .tml-category{display:inline-block;padding:4px 9px;border:1px solid #e2ebfd;border-radius:6px;background:#f5f8ff;color:#2563eb;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
  .tml-status{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid #e2ebfd;border-radius:6px;background:#f5f8ff;color:#2563eb;font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
  .tml-status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .tml-status.open,.tml-status.published,.tml-status.verified{border-color:#ccebdc;background:#effaf5;color:#16845b;}
  .tml-status.gated,.tml-status.pending,.tml-status.unknown{border-color:#fed7aa;background:#fff7ed;color:#b45309;}
  .tml-status.failed,.tml-status.restricted,.tml-status.rejected{border-color:#fecaca;background:#fff1f2;color:#dc2626;}
  .tml-dataset-card h3{margin:13px 0 8px;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25;}
  .tml-dataset-card>p{margin:0;color:#6b7280;font-size:13.5px;line-height:1.5;}
  .tml-review-status{margin-top:12px;}
  .tml-card-bottom{margin-top:auto;padding-top:15px;border-top:1px solid #f1f2f4;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;}
  .tml-meta-label{margin-bottom:3px;color:#9aa0ab;font-size:10px;letter-spacing:.04em;text-transform:uppercase;}
  .tml-meta-value{max-width:150px;overflow:hidden;color:#14161a;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
  .tml-card-counts{display:flex;gap:12px;color:#8a8f9a;font-size:11px;white-space:nowrap;}
  .tml-card-counts strong{color:#14161a;font-size:12px;}

  .tml-page{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:54px 0 110px;}
  .tml-page>h1,.tml-page-title{margin:0;font-size:34px;font-weight:600;letter-spacing:-.03em;}
  .tml-page-intro{max-width:650px;margin:11px 0 0;color:#6b7280;font-size:16px;line-height:1.55;}
  .tml-filter-search{max-width:560px;margin-top:28px;padding:4px 14px;display:flex;align-items:center;gap:10px;border:1.5px solid #e3e5e9;border-radius:12px;background:#fff;}
  .tml-filter-search input{font-size:14.5px;}
  .tml-filters{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
  .tml-result-line{margin:26px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#9aa0ab;font-size:13px;}
  .tml-state{padding:46px 28px;border:1px solid #e9eaee;border-radius:14px;background:#fff;text-align:center;}
  .tml-state.error{border-color:#fecaca;background:#fef2f2;}
  .tml-state.error h3{color:#b91c1c;}
  .tml-state p{max-width:560px;margin:8px auto 0;color:#6b7280;font-size:13.5px;line-height:1.55;}
  .tml-state .tml-button{margin-top:16px;}

  .tml-footer{border-top:1px solid #ececef;background:#fff;color:#8a8f9a;}
  .tml-footer-inner{width:min(var(--max),calc(100% - 48px));min-height:94px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:12px;}

  /*
   * Current public-route compatibility layer.
   * These selectors intentionally use the original restrained white/blue
   * visual language while the application keeps its source-first data model.
   */
  .shell{min-height:100vh;background:#fff;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid #ececef;backdrop-filter:blur(12px);}
  .nav{position:relative;width:min(var(--max),calc(100% - 48px));height:62px;margin:0 auto;display:flex;align-items:center;gap:22px;}
  .brand{display:flex;align-items:center;gap:12px;flex:none;color:#14161a;text-decoration:none;}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:#2563eb;display:grid;place-items:center;overflow:hidden;}
  .brand-mark svg{width:20px;height:20px;}
  .brand-name{font-size:16px;font-weight:700;letter-spacing:-.02em;}
  .navlinks{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .navlink{padding:8px 12px;border-radius:8px;color:#5b616e;text-decoration:none;font-size:13px;font-weight:400;white-space:nowrap;transition:background .12s,color .12s;}
  .navlink:hover{color:#14161a;background:#f5f6f8;}
  .navlink[aria-current="page"]{color:#14161a;background:#f1f2f4;}
  .nav-cta{padding:8px 12px;border-radius:8px;color:#2563eb;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;}
  .nav-cta:hover{background:#f3f7ff;}
  .nav-toggle{display:none;margin-left:auto;border:1px solid #e3e5e9;border-radius:8px;background:#fff;color:#14161a;padding:8px 11px;font-size:13px;}

  main{min-height:calc(100vh - 125px);}
  .container{width:min(var(--max),calc(100% - 48px));margin-inline:auto;}
  .page{padding:64px 0 84px;}
  h1,h2,h3,p{margin-top:0;}
  h1,h2,h3{font-family:var(--display);color:#14161a;}
  h1{line-height:1.02;letter-spacing:-.045em;}
  h2{line-height:1.12;letter-spacing:-.025em;}
  h3{line-height:1.28;}
  .muted{color:#7a808c;}
  .eyebrow{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#2563eb;}

  .hero{background:#fff;color:#14161a;padding:92px 0 54px;}
  .hero-grid{display:block;}
  .hero-grid>div:first-child{max-width:860px;}
  .hero .eyebrow{color:#2563eb;margin-bottom:17px;}
  .hero h1{max-width:880px;margin:0 0 22px;font-size:clamp(43px,5vw,58px);line-height:.98;letter-spacing:-.048em;}
  .hero h1 span{color:inherit;}
  .hero-copy{max-width:650px;color:#535965;font-size:18px;line-height:1.62;}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border:1px solid transparent;border-radius:9px;font:600 13px var(--body);text-decoration:none;cursor:pointer;transition:background .12s,border-color .12s,color .12s,filter .12s;}
  .btn-primary{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-light,.btn-ghost{background:#fff;border-color:#e3e5e9;color:#14161a;}
  .btn-light:hover,.btn-ghost:hover{border-color:#c9d6f5;background:#f7faff;color:#2563eb;}
  .btn-link{min-height:0;padding:0;background:transparent;color:#2563eb;}

  .signal-panel{max-width:650px;margin-top:34px;border:1px solid #e9eaee;border-radius:13px;background:#fafbfc;padding:20px;box-shadow:none;}
  .signal-label{font-family:var(--mono);color:#858b97;font-size:9px;letter-spacing:.08em;text-transform:uppercase;}
  .signal-path{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;}
  .signal-node{position:relative;text-align:center;min-width:0;}
  .signal-node:not(:last-child):after{content:"";position:absolute;left:calc(50% + 12px);right:calc(-50% + 12px);top:9px;height:1px;background:#b9ccf7;}
  .signal-dot{position:relative;z-index:1;width:18px;height:18px;margin:0 auto 9px;border:4px solid #fff;border-radius:50%;background:#2563eb;box-shadow:0 0 0 1px #2563eb;}
  .signal-node.pending .signal-dot{background:#f59e0b;box-shadow:0 0 0 1px #f59e0b;}
  .signal-node.off .signal-dot{background:#c7cbd2;box-shadow:0 0 0 1px #aeb3bd;}
  .signal-node span{font-family:var(--mono);font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:#7a808c;}
  .signal-readout{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:18px;padding-top:15px;border-top:1px solid #ececef;color:#7a808c;font-size:11px;}
  .signal-readout strong{color:#14161a;font-family:var(--mono);font-weight:500;}

  .stat-band{background:#fff;}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:46px 0 62px;border-top:1px solid #ececef;}
  .stat{min-width:0;}
  .stat-value{font-size:27px;font-weight:700;color:#14161a;}
  .stat:last-child .stat-value{color:#2563eb;}
  .stat-label{margin-top:8px;color:#858b97;font-size:13px;line-height:1.35;}

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:22px;}
  .section-head h1,.section-head h2{margin:10px 0 0;}
  .section-head h2{font-size:21px;letter-spacing:-.02em;}
  .section-copy{max-width:560px;margin:0;color:#6b7280;font-size:14px;line-height:1.6;}
  .grid{display:grid;gap:18px;}
  .card-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .card{background:#fff;border:1px solid #e9eaee;border-radius:14px;}
  .dataset-card{position:relative;display:flex;min-height:284px;flex-direction:column;padding:22px;color:#14161a;text-decoration:none;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s;}
  .dataset-card:hover{border-color:#c9d6f5;box-shadow:0 6px 22px rgba(20,22,26,.07);transform:translateY(-2px);}
  .card-kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .id{overflow:hidden;color:#8b919c;font:500 9px var(--mono);letter-spacing:.04em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap;}
  .status{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:#edf3ff;color:#2563eb;font:600 8px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
  .status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .status.open,.status.published,.status.verified{background:#eaf8f2;color:#16845b;}
  .status.gated,.status.pending,.status.unknown{background:#fff7ed;color:#b45309;}
  .status.failed,.status.restricted,.status.rejected{background:#fff1f2;color:#dc2626;}
  .dataset-card h3{margin:22px 0 10px;font-size:20px;letter-spacing:-.02em;overflow-wrap:anywhere;}
  .dataset-card p{display:-webkit-box;overflow:hidden;color:#646b77;font-size:14px;line-height:1.55;-webkit-box-orient:vertical;-webkit-line-clamp:3;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:auto 0 17px;}
  .tag{padding:4px 7px;border:1px solid #e3e5e9;border-radius:6px;background:#fafbfc;color:#646b77;font:500 8px var(--mono);letter-spacing:.035em;text-transform:uppercase;}
  .card-footer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:13px;border-top:1px solid #ececef;}
  .mini-value{overflow:hidden;color:#14161a;font:600 10px var(--mono);text-overflow:ellipsis;white-space:nowrap;}
  .mini-label{margin-top:3px;color:#979ca6;font:400 7px var(--mono);letter-spacing:.04em;text-transform:uppercase;}

  .filters{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .filters .field:first-child{grid-column:span 2;}
  .field{position:relative;}
  .field label{position:absolute;top:8px;left:12px;z-index:1;color:#858b97;font:500 8px var(--mono);letter-spacing:.06em;text-transform:uppercase;}
  input,select{width:100%;height:56px;padding:21px 12px 7px;border:1px solid #d9dce2;border-radius:9px;background:#fff;color:#14161a;font:14px var(--body);outline:none;}
  input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .result-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 20px;color:#858b97;font:10px var(--mono);}

  .empty,.error,.loading{padding:46px 24px;border:1px dashed #d9dce2;border-radius:13px;background:#fff;text-align:center;}
  .error{border-color:#fecaca;background:#fff7f7;}
  .error h3{color:#b91c1c;}
  .spinner{display:inline-block;width:22px;height:22px;border:2px solid #e3e5e9;border-top-color:#2563eb;border-radius:50%;animation:tmlSpin .7s linear infinite;}

  .detail-hero{padding:50px 0 38px;border-bottom:1px solid #ececef;background:#fff;color:#14161a;}
  .breadcrumbs{display:flex;align-items:center;gap:8px;margin-bottom:27px;color:#8b919c;font:9px var(--mono);}
  .breadcrumbs a{color:#2563eb;text-decoration:none;}
  .detail-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:30px;}
  .detail-title h1{margin:11px 0 15px;font-size:clamp(36px,5vw,54px);overflow-wrap:anywhere;}
  .detail-title p{max-width:780px;margin-bottom:0;color:#646b77;line-height:1.62;}
  .detail-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px;}
  .detail-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.55fr);align-items:start;gap:20px;}
  .detail-body>*{min-width:0;}
  .panel{min-width:0;padding:23px;border:1px solid #e9eaee;border-radius:14px;background:#fff;}
  .panel+.panel{margin-top:18px;}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:19px;}
  .panel-head>*{min-width:0;max-width:100%;}
  .panel-head h2,.panel-head h3{margin:0;}
  .panel h2{font-size:23px;}
  .definition{color:#535965;font-size:16px;line-height:1.7;}
  .kv{display:grid;grid-template-columns:140px 1fr;}
  .kv dt,.kv dd{margin:0;padding:12px 0;border-bottom:1px solid #ececef;}
  .kv dt{color:#8b919c;font:500 8px var(--mono);letter-spacing:.06em;text-transform:uppercase;}
  .kv dd{font-size:13px;overflow-wrap:anywhere;}
  .source-list,.file-list,.paper-list,.repro-list{display:grid;gap:9px;}
  .source-row,.file-row,.paper-row,.repro-row{padding:13px 14px;border:1px solid #e3e5e9;border-radius:9px;background:#fafbfc;}
  .source-row,.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;}
  .row-title{font-size:13px;font-weight:600;overflow-wrap:anywhere;}
  .row-meta{margin-top:4px;color:#8b919c;font:400 8px var(--mono);letter-spacing:.035em;text-transform:uppercase;}

  .rail-wrap{padding:27px;border:1px solid #e9eaee;border-radius:14px;background:#fafbfc;color:#14161a;overflow:hidden;}
  .rail-wrap .signal-path{max-width:680px;margin:8px auto 0;}
  .rail-copy{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:17px;}
  .rail-copy div{text-align:center;min-width:0;}
  .rail-copy strong{display:block;overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap;}
  .rail-copy span{display:block;margin-top:4px;color:#8b919c;font:400 8px var(--mono);text-transform:uppercase;}
  .prose{max-width:820px;}
  .prose h2{margin-top:42px;}
  .prose h3{margin-top:28px;}
  .prose p,.prose li{color:#535965;line-height:1.72;}
  .prose li+li{margin-top:8px;}
  .steps{display:grid;gap:12px;margin-top:22px;counter-reset:step;}
  .step{display:grid;grid-template-columns:46px 1fr;gap:16px;padding:18px;border:1px solid #e9eaee;border-radius:13px;background:#fff;counter-increment:step;}
  .step:before{content:counter(step,decimal-leading-zero);color:#2563eb;font-size:19px;font-weight:700;}
  .step h3{margin:0 0 6px;}
  .step p{margin:0;}
  .coverage-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .coverage-card{padding:20px;}
  .coverage-card strong{font-size:27px;}
  .coverage-card h3{margin:10px 0 6px;}
  .coverage-card p{margin:0;color:#6b7280;font-size:13px;line-height:1.55;}
  .evidence{padding:13px 15px;border-left:3px solid #f59e0b;background:#fffaf0;color:#6b5734;font-size:13px;line-height:1.6;}
  .loading-example{margin-top:14px;padding:14px;border:1px solid #dfe4ef;border-radius:9px;background:#f7faff;}
  .loading-example .row-meta{margin:0 0 9px;color:#7180a0;}
  .loading-example pre{margin:0;overflow:auto;color:#263246;font:12px/1.55 var(--mono);}
  .repro-table{width:100%;border-collapse:collapse;font-size:12px;}
  .repro-table th,.repro-table td{padding:12px;border-bottom:1px solid #ececef;text-align:left;vertical-align:top;}
  .repro-table th{color:#8b919c;font:500 8px var(--mono);letter-spacing:.06em;text-transform:uppercase;}

  footer{border-top:1px solid #ececef;background:#fff;color:#858b97;}
  .footer-inner{display:flex;min-height:94px;align-items:center;justify-content:space-between;gap:24px;font:9px var(--mono);}
  .footer-links{display:flex;gap:18px;}
  .footer-links a{color:#5b616e;text-decoration:none;}
  .footer-links a:hover{color:#2563eb;}
  .toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:380px;padding:13px 16px;border:1px solid #c9d6f5;border-radius:10px;background:#14161a;color:#fff;box-shadow:0 8px 24px rgba(20,22,26,.18);font-size:13px;}

  /* loading spinner (API fetch states) */
  @keyframes tmlSpin{to{transform:rotate(360deg)}}
  .tml-spinner{display:inline-block;width:20px;height:20px;border:2.5px solid #e3e5e9;border-top-color:#2563eb;border-radius:50%;animation:tmlSpin .7s linear infinite;vertical-align:middle;}

  /* reproduction-in-progress pulse (dataset cards + leaderboard rows) */
  @keyframes tmlPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35);border-color:#2563eb;}50%{box-shadow:0 0 0 8px rgba(37,99,235,0);border-color:#93b4f8;}}
  .tml-running{animation:tmlPulse 1.6s ease-in-out infinite;border-color:#2563eb !important;}
  @keyframes tmlPulseRow{0%,100%{background-color:#e8f0fe;}50%{background-color:#f8faff;}}
  .tml-running-row{animation:tmlPulseRow 1.6s ease-in-out infinite;box-shadow:inset 3px 0 0 #2563eb;}
  .tml-spinner-xs{display:inline-block;width:10px;height:10px;border:2px solid #b9ccf7;border-top-color:#2563eb;border-radius:50%;animation:tmlSpin .7s linear infinite;vertical-align:-1px;margin-right:5px;}

  @media (max-width:640px){
    .tml-hero{font-size:36px !important;}
    .tml-rungrid{grid-template-columns:minmax(0,1fr) !important;}
    .tml-header-inner,.tml-herosec,.tml-section,.tml-page,.tml-footer-inner{width:min(100% - 30px,var(--max));}
    .tml-nav{display:flex;position:absolute;top:54px;right:0;left:0;z-index:2;align-items:stretch;flex-direction:column;padding:9px;border:1px solid #e3e5e9;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(20,22,26,.1);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .12s,transform .12s;}
    .tml-nav.open{opacity:1;pointer-events:auto;transform:none;}
    .tml-nav-toggle{display:block;}
    .tml-herosec{padding:62px 0 50px;}
    .tml-hero{font-size:39px !important;}
    .tml-hero-copy{font-size:16px;}
    .tml-searchbox{align-items:stretch;flex-wrap:wrap;padding:10px 10px 10px 14px;}
    .tml-searchbox svg{align-self:center;}
    .tml-searchbox .tml-button{width:100%;}
    .tml-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px;margin-top:44px;}
    .tml-stat-value{font-size:29px;}
    .tml-section{padding-bottom:70px;}
    .tml-section-heading{align-items:flex-start;flex-direction:column;gap:8px;}
    .tml-page{padding:42px 0 70px;}
    .tml-page>h1,.tml-page-title{font-size:32px;}
    .tml-filters{grid-template-columns:1fr;}
    .tml-result-line{align-items:flex-start;flex-direction:column;}
    .tml-card-bottom{align-items:flex-start;flex-direction:column;}
    .tml-footer-inner{align-items:flex-start;flex-direction:column;padding:24px 0;}
    .navlinks{display:none;position:absolute;top:54px;right:0;left:0;z-index:2;margin-left:0;padding:9px;border:1px solid #e3e5e9;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(20,22,26,.1);}
    .navlinks.open{display:grid;}
    .nav-toggle{display:block;}
    .nav-cta{display:none;}
    .container,.nav{width:min(100% - 30px,var(--max));}
    .page{padding:42px 0 62px;}
    .hero{padding:62px 0 42px;}
    .hero h1{font-size:39px;}
    .hero-copy{font-size:16px;}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px;padding:38px 0 50px;}
    .card-grid,.coverage-grid,.filters{grid-template-columns:1fr;}
    .filters .field:first-child{grid-column:auto;}
    .section-head{align-items:flex-start;flex-direction:column;}
    .card-footer{grid-template-columns:repeat(2,minmax(0,1fr));}
    .detail-body,.detail-title{grid-template-columns:1fr;}
    .detail-title h1{font-size:34px !important;}
    .detail-actions .btn{width:100%;}
    .panel-head{flex-direction:column;gap:10px;}
    .kv{grid-template-columns:1fr;}
    .kv dt{padding-bottom:3px;border:0;}
    .kv dd{padding-top:0;}
    .rail-wrap{padding:22px 12px;}
    .rail-copy{gap:7px;}
    .rail-copy strong{font-size:9px;}
    .source-row,.file-row{grid-template-columns:1fr;}
    .footer-inner{align-items:flex-start;flex-direction:column;padding:26px 0;}
    .repro-table{display:block;max-width:100%;overflow-x:auto;}
  }
  @media (min-width:641px) and (max-width:980px){
    .tml-rungrid{grid-template-columns:minmax(0,1fr) !important;}
    .tml-nav{display:flex;position:absolute;top:54px;right:0;left:0;z-index:2;align-items:stretch;flex-direction:column;padding:9px;border:1px solid #e3e5e9;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(20,22,26,.1);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .12s,transform .12s;}
    .tml-nav.open{opacity:1;pointer-events:auto;transform:none;}
    .tml-nav-toggle{display:block;}
    .tml-filters{grid-template-columns:repeat(2,minmax(0,1fr));}
    .navlinks{display:none;position:absolute;top:54px;right:0;left:0;z-index:2;margin-left:0;padding:9px;border:1px solid #e3e5e9;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(20,22,26,.1);}
    .navlinks.open{display:grid;}
    .nav-toggle{display:block;}
    .nav-cta{display:none;}
    .detail-body{grid-template-columns:1fr;}
    .card-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .filters{grid-template-columns:repeat(2,minmax(0,1fr));}
    .filters .field:first-child{grid-column:1/-1;}
    .detail-title{grid-template-columns:1fr;}
    .detail-actions{justify-content:flex-start;}
    .coverage-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }

  /* OPENWIRELESSML PRECISION OVERRIDES */
  :root{
    color-scheme:dark;
    --ink:#e0e3e5;
    --muted:#aeb3b8;
    --subtle:#7f868b;
    --line:#34393d;
    --line-strong:#50565c;
    --paper:#101415;
    --white:#191c1e;
    --blue:#9cf0ff;
    --blue-dark:#00daf3;
    --cyan:#9cf0ff;
    --amber:#e7c47a;
    --amber-soft:#251f15;
    --red:#ffb4ab;
    --green:#83d8c1;
    --radius:4px;
    --shadow:none;
    --max:1440px;
    --display:"Instrument Sans","Segoe UI",sans-serif;
    --body:"Instrument Sans","Segoe UI",sans-serif;
    --mono:"IBM Plex Mono","Cascadia Mono",monospace;
    --surface-lowest:#0b0f10;
    --surface-low:#15191b;
    --surface:#1d2022;
    --surface-high:#272a2c;
    --accent:#9cf0ff;
  }
  html{background:var(--surface-lowest);}
  body{
    color:var(--ink);
    background-color:var(--surface-lowest);
    background-image:
      linear-gradient(rgba(156,240,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(156,240,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
    font-family:var(--body);
  }
  body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  ::selection{background:var(--accent);color:#001f24;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  h1,h2,h3{font-family:var(--display);color:var(--ink);}
  a{color:inherit;}
  .mono,.id,.row-meta,.eyebrow,.ow-kicker{font-family:var(--mono);}

  .shell{min-height:100vh;background:transparent;}
  .tml-header{
    height:65px;
    border-bottom:1px solid rgba(144,144,150,.28);
    background:rgba(11,15,16,.97);
    backdrop-filter:none;
  }
  .tml-header-inner{
    width:min(var(--max),calc(100% - 80px));
    height:64px;
    gap:32px;
  }
  .tml-brand{gap:12px;color:var(--ink);text-decoration:none;}
  .tml-brand-copy{display:flex;flex-direction:column;gap:2px;}
  .tml-brand-copy strong{font-size:16px;line-height:1;font-weight:680;letter-spacing:-.025em;}
  .tml-brand-copy small{color:var(--subtle);font:500 7px/1 var(--mono);letter-spacing:.14em;}
  .tml-logo{
    width:32px;
    height:28px;
    padding:5px 5px 4px;
    gap:2px;
    border:1px solid rgba(156,240,255,.62);
    border-radius:2px;
    background:rgba(156,240,255,.04);
  }
  .tml-logo span{
    width:2px;
    border-radius:0;
    background:var(--accent);
    box-shadow:0 0 7px rgba(156,240,255,.25);
  }
  .tml-nav{height:100%;gap:6px;}
  .tml-navlink{
    position:relative;
    display:flex;
    height:100%;
    align-items:center;
    padding:0 11px;
    border-radius:0;
    color:#aeb3b8;
    font:500 10px/1 var(--mono);
    letter-spacing:.065em;
    text-transform:uppercase;
  }
  .tml-navlink:hover{color:var(--ink);background:rgba(156,240,255,.035);}
  .tml-navlink.active,.tml-navlink[aria-current="page"]{
    color:var(--accent);
    background:transparent;
  }
  .tml-navlink.active:after,.tml-navlink[aria-current="page"]:after{
    content:"";
    position:absolute;
    right:10px;
    bottom:-1px;
    left:10px;
    height:2px;
    background:var(--accent);
  }
  .tml-nav-toggle{
    border:1px solid var(--line-strong);
    border-radius:2px;
    background:var(--surface-low);
    color:var(--ink);
    font:500 10px var(--mono);
    text-transform:uppercase;
  }

  .tml-herosec{
    width:min(var(--max),calc(100% - 80px));
    padding:76px 0 0;
  }
  .ow-hero-grid{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,.9fr) minmax(500px,1.1fr);
    align-items:center;
    gap:64px;
    min-height:590px;
    padding-bottom:64px;
  }
  .ow-hero-grid:before{
    content:"";
    position:absolute;
    top:-76px;
    bottom:0;
    left:50%;
    border-left:1px solid rgba(144,144,150,.12);
  }
  .ow-hero-copy{position:relative;z-index:1;}
  .ow-kicker{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--accent);
    font-size:10px;
    font-weight:500;
    letter-spacing:.12em;
  }
  .ow-kicker span{width:18px;height:1px;background:currentColor;}
  .tml-hero{
    max-width:720px;
    margin:22px 0 26px;
    color:var(--ink);
    font-size:clamp(54px,5.2vw,82px);
    font-weight:650;
    line-height:.98;
    letter-spacing:-.055em;
  }
  .tml-hero em{color:var(--accent);font-style:normal;}
  .tml-hero-copy{
    max-width:640px;
    margin:0;
    color:#b5bac0;
    font-size:18px;
    line-height:1.7;
  }
  .ow-hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;}
  .ow-scope-note{
    display:flex;
    align-items:center;
    gap:10px;
    margin:34px 0 0;
    color:var(--subtle);
    font-size:12px;
  }
  .ow-scope-note span{
    padding:5px 7px;
    border:1px solid var(--line);
    color:#c8cdd1;
    font:500 8px var(--mono);
    letter-spacing:.08em;
  }

  .tml-button,.btn{
    min-height:42px;
    padding:10px 16px;
    border:1px solid var(--line-strong);
    border-radius:2px;
    background:transparent;
    color:var(--ink);
    font:500 11px var(--mono);
    letter-spacing:.035em;
    text-transform:uppercase;
  }
  .tml-button:hover,.btn:hover,.btn-light:hover,.btn-ghost:hover{
    border-color:var(--accent);
    background:rgba(156,240,255,.06);
    color:var(--accent);
  }
  .tml-button.primary,.btn-primary{
    border-color:var(--accent);
    background:var(--accent);
    color:#001f24;
  }
  .tml-button.primary:hover,.btn-primary:hover{
    border-color:#bdf4ff;
    background:#bdf4ff;
    color:#001f24;
    filter:none;
  }
  .btn-link{border:0;color:var(--accent);padding:0;text-transform:none;}

  .ow-observatory{
    position:relative;
    min-width:0;
    border:1px solid rgba(144,144,150,.38);
    border-radius:2px;
    background:rgba(16,20,21,.78);
  }
  .ow-observatory:before,.ow-observatory:after{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    pointer-events:none;
  }
  .ow-observatory:before{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);}
  .ow-observatory:after{right:-1px;bottom:-1px;border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);}
  .ow-panel-head{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:13px 16px;
    border-bottom:1px solid rgba(144,144,150,.28);
    color:#8f969c;
    font:500 9px var(--mono);
    letter-spacing:.1em;
  }
  .ow-live{color:var(--accent);}
  .ow-live i{
    display:inline-block;
    width:5px;
    height:5px;
    margin-right:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(156,240,255,.08);
  }
  .ow-spectrum{
    position:relative;
    min-height:390px;
    padding:28px 20px 16px;
    overflow:hidden;
    background:
      linear-gradient(180deg,rgba(156,240,255,.018),transparent),
      var(--surface-lowest);
  }
  .ow-spectrum svg{display:block;width:100%;height:auto;overflow:visible;}
  .ow-grid-lines{fill:none;stroke:#5e656a;stroke-width:.7;opacity:.27;}
  .ow-band-labels,.ow-axis{fill:#777f85;font:500 8px var(--mono);letter-spacing:.1em;}
  .ow-trace-glow{
    fill:none;
    stroke:var(--accent);
    stroke-width:8;
    opacity:.08;
  }
  .ow-trace{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.7;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:950;
    animation:owTrace 2.2s ease-out both;
  }
  .ow-markers{fill:var(--surface-lowest);stroke:var(--accent);stroke-width:1.5;}
  .ow-reticle{position:absolute;width:24px;height:24px;border:1px solid rgba(156,240,255,.28);border-radius:50%;}
  .ow-reticle:before,.ow-reticle:after{content:"";position:absolute;background:rgba(156,240,255,.32);}
  .ow-reticle:before{left:11px;top:-6px;width:1px;height:34px;}
  .ow-reticle:after{left:-6px;top:11px;width:34px;height:1px;}
  .ow-reticle-a{left:47%;top:21%;}
  .ow-reticle-b{right:13%;bottom:24%;transform:scale(.72);}
  .ow-readouts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(144,144,150,.28);}
  .ow-readouts>div{padding:14px 15px;border-right:1px solid rgba(144,144,150,.22);}
  .ow-readouts>div:last-child{border-right:0;}
  .ow-readouts span{display:block;color:#747b80;font:500 8px var(--mono);letter-spacing:.08em;}
  .ow-readouts strong{display:block;margin-top:7px;color:var(--ink);font:500 18px var(--mono);}
  @keyframes owTrace{from{stroke-dashoffset:950}to{stroke-dashoffset:0}}

  .tml-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    margin-top:0;
    padding:0;
    border:1px solid rgba(144,144,150,.28);
    background:rgba(11,15,16,.7);
  }
  .tml-stats>div{min-height:116px;padding:22px;border-right:1px solid rgba(144,144,150,.25);}
  .tml-stats>div:last-child{border-right:0;}
  .tml-stat-value{color:var(--ink);font-size:30px;font-weight:500;}
  .tml-stats>div:last-child .tml-stat-value{color:var(--ink);}
  .tml-stat-label{max-width:190px;margin-top:9px;color:#858c91;font-size:12px;line-height:1.45;}

  .tml-section{
    width:min(var(--max),calc(100% - 80px));
    padding:110px 0;
  }
  .ow-section-intro{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(320px,.58fr);
    align-items:end;
    gap:64px;
    padding-bottom:40px;
    border-bottom:1px solid rgba(144,144,150,.25);
  }
  .ow-section-intro h2,.ow-scope h2{
    max-width:760px;
    margin:18px 0 0;
    font-size:clamp(34px,3.4vw,52px);
    line-height:1.08;
